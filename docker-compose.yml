services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compacting-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${API_PORT:-5126}:5126"
    env_file:
      - path: .env
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://+:80;http://+:8080;http://+:5126}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=compacting;Username=postgres;Password=compacting_secret;}
      - Dragonfly__Endpoint=${Dragonfly__Endpoint:-dragonfly:6379}
      - Dragonfly__Password=${Dragonfly__Password:-}
      - Dragonfly__KeyPrefix=${Dragonfly__KeyPrefix:-compacting}
      - Jwt__Secret=${Jwt__Secret:-c0mp4ct1ng_sup3r_s3cur3_jwt_s3cr3t_k3y_2026_x99_m4x_pr0t0c0l!}
      - Jwt__Issuer=${Jwt__Issuer:-CompactingApi}
      - Jwt__Audience=${Jwt__Audience:-CompactingClients}
    depends_on:
      - postgres
      - dragonfly

  postgres:
    image: postgres:16-alpine
    container_name: compacting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compacting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compacting_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: compacting-dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

volumes:
  postgres_data:
